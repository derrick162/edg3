<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  body {
    margin: 0;
    background: var(--surface-page);
    font-family: var(--font-sans);
    color: var(--text-strong);
  }
  .wrap { padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 20px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Textarea, Select, Checkbox } = window.Edg3DesignSystem_b79f44;
  function Demo() {
    const [tasks, setTasks] = React.useState([true, false]);
    return (
      <>
        <div className="col">
          <Input label="Email" type="email" placeholder="you@example.com" />
          <Select label="Timezone" defaultValue="America/New_York" options={[
            { label: 'New York / Toronto (ET)', value: 'America/New_York' },
            { label: 'London (GMT)', value: 'Europe/London' },
            { label: 'Tokyo (JST)', value: 'Asia/Tokyo' },
          ]} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 4 }}>
            <Checkbox checked={tasks[0]} onChange={(v) => setTasks([v, tasks[1]])} label="Review Q3 board deck" />
            <Checkbox checked={tasks[1]} onChange={(v) => setTasks([tasks[0], v])} label="Protect 9–11am for deep work" />
          </div>
        </div>
        <div className="col">
          <Textarea label="Paste your ChatGPT summary here" rows={7}
            placeholder="Paste your full summary here. The more detail, the better Edg3 can serve you…" />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
