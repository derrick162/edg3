<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark" subtitle="EDG3 gradient logo — the brand has no separate icon mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); display: flex; align-items: center; }
  .wrap { padding: 26px 30px; display: flex; align-items: center; gap: 40px; }
  .lock { display: flex; flex-direction: column; }
  .eyebrow { font-size: 11px; color: var(--edg-indigo); letter-spacing: var(--tracking-wide); margin-top: 4px; }
  .note { font-size: 12px; color: var(--text-muted); line-height: 1.6; max-width: 240px; }
  .note b { color: var(--text-body); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lock">
    <span class="logo-text" style="font-size:48px">EDG3</span>
    <span class="eyebrow">ELITE DAILY GUIDANCE ENGINE</span>
  </div>
  <p class="note"><b>Inter Black, -0.05em tracking.</b> Ink→violet→indigo gradient clip, tuned for the near-black canvas. Use the "E" alone only as a compact avatar mark.</p>
</div>
</body>
</html>
