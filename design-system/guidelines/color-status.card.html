<!-- @dsCard group="Colors" viewport="700x170" name="Semantic Status" subtitle="Success, warning & danger — solid and as badge tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 22px; }
  .cell { display: flex; flex-direction: column; gap: 10px; }
  .sw { border-radius: var(--radius-md); height: 48px; display: flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell">
    <div class="sw" style="background:var(--edg-success);color:#04140d">#10b981</div>
    <span class="badge badge-success">✓ Completed</span>
  </div>
  <div class="cell">
    <div class="sw" style="background:var(--edg-warning);color:#1a1203">#f59e0b</div>
    <span class="badge badge-pending">⚠ Carried over</span>
  </div>
  <div class="cell">
    <div class="sw" style="background:var(--edg-danger);color:#1a0606">#ef4444</div>
    <span class="badge badge-danger">Missed</span>
  </div>
</div>
</body>
</html>
