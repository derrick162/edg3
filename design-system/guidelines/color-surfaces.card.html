<!-- @dsCard group="Colors" viewport="700x180" name="Canvas & Surfaces" subtitle="Near-black navy canvas and frosted glass surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 22px; }
  .sw { border-radius: var(--radius-md); border: 1px solid var(--border-card); padding: 16px; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font-size: 13px; font-weight: 600; }
  .val { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw" style="background:var(--edg-bg)"><span class="name">Canvas</span><span class="val">--edg-bg · #0a0a0f</span></div>
  <div class="sw" style="background:var(--edg-bg-elevated)"><span class="name">Card surface</span><span class="val">--edg-bg-elevated · #111118</span></div>
  <div class="sw" style="background:var(--edg-bg-select)"><span class="name">Popover fill</span><span class="val">--edg-bg-select · #1a1a2e</span></div>
</div>
</body>
</html>
