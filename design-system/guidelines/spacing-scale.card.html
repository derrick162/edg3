<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base grid from 4 to 64px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); }
  .wrap { padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .bar { height: 16px; background: var(--edg-gradient-accent); border-radius: 3px; }
  .name { font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); width: 96px; }
  .px { font-size: 12px; color: var(--text-faint); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="name">--space-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
  <div class="row"><span class="name">--space-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
  <div class="row"><span class="name">--space-4</span><div class="bar" style="width:16px"></div><span class="px">16 · row gap</span></div>
  <div class="row"><span class="name">--space-6</span><div class="bar" style="width:24px"></div><span class="px">24 · card padding</span></div>
  <div class="row"><span class="name">--space-8</span><div class="bar" style="width:32px"></div><span class="px">32 · section gap</span></div>
  <div class="row"><span class="name">--space-16</span><div class="bar" style="width:64px"></div><span class="px">64 · hero rhythm</span></div>
</div>
</body>
</html>
