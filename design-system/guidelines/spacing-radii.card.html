<!-- @dsCard group="Spacing" viewport="700x170" name="Corner Radii" subtitle="From 8px chips to fully-rounded pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 22px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 100%; height: 64px; background: var(--edg-accent-15); border: 1px solid var(--border-accent); }
  .name { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="name">sm · 8<br>chips</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><span class="name">md · 10<br>buttons</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="name">lg · 16<br>cards</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="name">xl · 18<br>bubbles</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="name">pill · 999<br>badges</span></div>
</div>
</body>
</html>
