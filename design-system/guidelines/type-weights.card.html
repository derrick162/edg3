<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 22px 26px 0; }
  .spec { font-size: 30px; }
  .val { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .legend { padding: 16px 26px 22px; font-size: 12px; color: var(--text-muted); }
  b { color: var(--text-body); font-weight: 600; }
</style>
</head>
<body>
<div class="row">
  <span class="spec" style="font-weight:400">Aa</span>
  <span class="spec" style="font-weight:500">Aa</span>
  <span class="spec" style="font-weight:600">Aa</span>
  <span class="spec" style="font-weight:700">Aa</span>
  <span class="spec" style="font-weight:900">Aa</span>
</div>
<p class="legend"><b>400</b> Regular &nbsp;·&nbsp; <b>500</b> Medium &nbsp;·&nbsp; <b>600</b> Semibold (buttons, labels) &nbsp;·&nbsp; <b>700</b> Bold (headings) &nbsp;·&nbsp; <b>900</b> Black (display, logo)</p>
</body>
</html>
