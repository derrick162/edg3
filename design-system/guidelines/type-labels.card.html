<!-- @dsCard group="Type" viewport="700x150" name="Eyebrows & Labels" subtitle="All-caps indigo labels with wide tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .eyebrow { font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-accent); margin: 0; }
  .eyebrow-q { color: var(--edg-indigo); }
  .label { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-muted); margin: 0; }
  .val { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><p class="eyebrow eyebrow-q">✦ SUGGESTED BY EDG3</p><span class="val">12px / 600 / 0.08em caps · --tracking-wide</span></div>
  <div class="row"><p class="eyebrow">CHAT WITH EDGE</p><span class="val">indigo-bright eyebrow</span></div>
  <div class="row"><p class="label">Call time</p><span class="val">Form label — 14px / 500 muted</span></div>
</div>
</body>
</html>
