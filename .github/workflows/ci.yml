name: CI

# Runs on every push to master and on PRs. Catches broken builds / call-breaking
# Vapi tools BEFORE they reach users (we push straight to Railway, so this is our
# automatic safety net — and the foundation for branch-protected gating pre-launch).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # From repo secrets — used only by the Vapi safety check (skipped if unset).
      VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Vapi tool safety check
        # Only runs if the VAPI_API_KEY secret is configured (otherwise skipped, not failed).
        if: ${{ env.VAPI_API_KEY != '' }}
        run: npm run check:vapi
